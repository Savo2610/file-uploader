<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenYards Monitor</title>
<meta name="theme-color" content="#2f5de0">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2230;--mut:#6b7385;--line:#e3e6ec;--ok:#1a8f4c;--err:#c8332b;--warn:#b7791f;--acc:#2f5de0;--flash:#fff4c2}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--fg:#e6e9f2;--mut:#8b93a7;--line:#2b3247;--ok:#47c27e;--err:#ef6b62;--warn:#e0a94a;--acc:#7b9bff;--flash:#4a4320}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
h1{font-size:16px;margin:0 12px 0 0}
input,select,button{font:inherit;font-size:16px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc)}button.sec{background:transparent;color:var(--fg);border-color:var(--line)}
.mut{color:var(--mut)}main{padding:12px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
@media(max-width:480px){main{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.card.flash{animation:fl 1.6s}@keyframes fl{from{background:var(--flash)}to{background:var(--card)}}
.ch{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.ch b{flex:1}.pill{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
.cb{padding:8px 12px;max-height:300px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:3px 8px 3px 0;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}th{color:var(--mut);font-weight:500;white-space:nowrap}
details{margin-top:6px}summary{cursor:pointer;color:var(--mut);font-size:12px}pre{margin:6px 0 0;font-size:12px;white-space:pre-wrap;word-break:break-all}
.wide{grid-column:1/-1}.msg{color:var(--err)}
</style>
</head>
<body>
<header>
  <h1>OpenYards Monitor</h1>
  <form id="login" style="display:flex;gap:6px;flex-wrap:wrap">
    <input id="u" placeholder="Benutzer" autocomplete="username" required>
    <input id="p" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <button>Anmelden</button>
  </form>
  <span id="who" class="mut" hidden></span>
  <select id="game" hidden></select><select id="profile" hidden></select>
  <button id="go" hidden>Überwachen</button><button id="stop" class="sec" hidden>Stopp</button><button id="out" class="sec" hidden>Abmelden</button>
  <label class="mut" hidden id="ivl">Takt schnell/langsam (s)
    <input id="fast" type="number" min="5" style="width:60px"> <input id="slow" type="number" min="5" style="width:60px">
  </label>
  <span id="msg" class="msg"></span>
</header>
<main id="cards"></main>
<main><section class="card wide"><div class="ch"><b>Request-Log</b><span class="mut">letzte 80</span></div>
<div class="cb" style="max-height:260px"><table id="log"></table></div></section></main>
<script>
const API='https://oybackend-prod-1079304395897.europe-west3.run.app/api/';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ENDPOINTS={
  map_positions:['gamecore/{id}/map_positions/','fast'],game_events:['gamecore/{id}/get_game_events/','fast'],
  last_position:['movement/{id}/get_last_positionlog/','fast'],game_info:['gamecore/{id}/get_game_info_for_gl/','slow'],
  messages:['messaging/{id}/get_messages/','slow'],move_options:['movement/{id}/get_options/','slow'],
  mrx_views:['catching/{id}/get_mrx_views/','slow'],mrx_live_views:['catching/{id}/get_mrx_live_views/','slow'],
  mrx_next_update:['catching/{id}/get_mrx_next_views_update_date/','slow'],catchable_mrx:['catching/{id}/get_catchable_mrx/','slow'],
  group_evaluations:['evaluation/{id}/get_player_group_evaluations/','slow'],logs:['evaluation/{id}/get_logs/','slow']};
const TITLES={map_positions:'Kartenpositionen',game_events:'Spiel-Events',last_position:'Letzte Position',game_info:'Spielinfo',messages:'Nachrichten',move_options:'Bewegungsoptionen',mrx_views:'Mr.-X-Sichtungen',mrx_live_views:'Mr.-X live',mrx_next_update:'Nächstes Mr.-X-Update',catchable_mrx:'Fangbare Mr. X',group_evaluations:'Gruppenauswertung',logs:'Logs'};
let tok=store.get('oy_tok')||null, user=store.get('oy_user')||null, sel=store.get('oy_sel')||null;
let iv=store.get('oy_iv')||{fast:5,slow:60}, gen=0, eps={}, log=[], refreshing=null;

async function raw(method,path,body,params,auth=true){
  let url=API+path; if(params)url+='?'+new URLSearchParams(params);
  const h={Accept:'application/json'}; if(body)h['Content-Type']='application/json';
  if(auth&&tok)h.Authorization='Bearer '+tok.access;
  const t0=performance.now();
  try{const r=await fetch(url,{method,headers:h,body:body?JSON.stringify(body):undefined});
    let p=null;try{p=await r.json()}catch(e){}
    return{status:r.status,data:p,ms:Math.round(performance.now()-t0)}}
  catch(e){return{status:0,data:{error:String(e)},ms:Math.round(performance.now()-t0)}}}
async function refresh(){
  if(!tok?.refresh)return false;
  refreshing=refreshing||raw('POST','token/refresh/',{refresh:tok.refresh},null,false).then(r=>{
    refreshing=null;if(r.status===200&&r.data?.access){tok={access:r.data.access,refresh:r.data.refresh||tok.refresh};store.set('oy_tok',tok);return true}
    return false});
  return refreshing}
async function call(path,params){
  let r=await raw('GET',path,null,params);
  if(r.status===401&&await refresh())r=await raw('GET',path,null,params);
  if(r.status===401&&!tok)logout();
  return r}
function logout(){gen++;tok=user=sel=null;eps={};log=[];['oy_tok','oy_user','oy_sel'].forEach(store.del);ui()}

function record(name,path,r){
  const now=Date.now()/1e3,e=eps[name]||(eps[name]={changed:now,calls:0});
  if(r.status===200&&JSON.stringify(r.data)!==JSON.stringify(e.data)){e.changed=now;e.data=r.data}
  Object.assign(e,{status:r.status,ms:r.ms,ts:now,path,error:r.status===200?null:r.data});e.calls++;
  log.unshift({ts:now,path,status:r.status,ms:r.ms});log.length=Math.min(log.length,80);paint()}
function startPolling(){
  gen++;eps={};log=[];const g=gen,id=sel.profileId;
  for(const[name,[tpl,grp]]of Object.entries(ENDPOINTS)){
    const path=tpl.replace('{id}',id);let events=new Map(),since=null;
    const loop=async()=>{
      if(g!==gen)return;
      if(!document.hidden){                                 // im Hintergrund nicht abfragen (Akku, Datenvolumen)
        const params=name==='game_events'&&since?{since}:null;
        const r=await call(path,params);if(g!==gen)return;
        if(name==='game_events'&&r.status===200&&Array.isArray(r.data)){
          r.data.forEach(e=>e&&e.id!=null&&events.set(e.id,e));
          r.data=[...events.values()].sort((a,b)=>String(b.time||'').localeCompare(String(a.time||'')));
          since=r.data[0]?.time||since}
        record(name,path+(params?'?since='+params.since:''),r)}
      timers[name]=setTimeout(loop,Math.max(5,iv[grp])*1000)};
    clearTimeout(timers[name]);loop()}}
const timers={};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sel){Object.values(timers).forEach(clearTimeout);startPolling()}});

const scalar=v=>v===null?'<span class=mut>–</span>':typeof v==='object'?'<span class=mut>{…}</span>':esc(v);
function render(d){
  if(d==null)return'<span class=mut>keine Daten</span>';
  if(Array.isArray(d)){
    if(!d.length)return'<span class=mut>leer</span>';
    if(typeof d[0]==='object'&&d[0]){const cols=[...new Set(d.slice(0,50).flatMap(o=>Object.keys(o||{})))].slice(0,6);
      return`<div class=mut>${d.length} Einträge</div><div style="overflow-x:auto"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${d.slice(0,100).map(o=>`<tr>${cols.map(c=>`<td>${scalar(o?.[c])}</td>`).join('')}</tr>`).join('')}</table></div>`}
    return d.map(scalar).join(', ')}
  if(typeof d==='object')return`<table>${Object.entries(d).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${typeof v==='object'&&v?render(v):scalar(v)}</td></tr>`).join('')}</table>`;
  return esc(d)}
const ago=s=>s<2?'jetzt':s<90?Math.round(s)+' s':Math.round(s/60)+' min';
const prevChanged={};
function paint(){
  const now=Date.now()/1e3;
  $('cards').innerHTML=Object.keys(eps).map(n=>{const e=eps[n],ok=e.status===200;
    const fl=prevChanged[n]&&prevChanged[n]!==e.changed;prevChanged[n]=e.changed;
    return`<section class="card${fl?' flash':''}"><div class=ch><b>${TITLES[n]||n}</b>
      <span class="pill ${ok?'ok':'err'}">${e.status||'ERR'}</span><span class=mut>${e.ms} ms</span></div>
      <div class=cb>${ok?render(e.data):`<span class=err>${esc(JSON.stringify(e.error))}</span>`}
      <details><summary>Roh-JSON</summary><pre>${esc(JSON.stringify(e.data,null,1)||'')}</pre></details></div>
      <div class=ch style="border:0;border-top:1px solid var(--line);flex-wrap:wrap"><span class=mut style="font-size:12px">abgefragt ${ago(now-e.ts)} · geändert ${ago(now-e.changed)} · ${e.calls}×</span></div></section>`}).join('');
  $('log').innerHTML='<tr><th>Zeit</th><th>Endpunkt</th><th>Status</th><th>ms</th></tr>'+log.map(l=>`<tr><td>${new Date(l.ts*1e3).toLocaleTimeString()}</td><td>${esc(l.path)}</td><td class="${l.status===200?'ok':'err'}">${l.status}</td><td>${l.ms}</td></tr>`).join('')}
function ui(){
  $('login').hidden=!!user;$('who').hidden=!user;$('who').textContent=user?'angemeldet: '+user:'';
  ['game','profile','go','ivl','out'].forEach(i=>$(i).hidden=!user);$('stop').hidden=!sel;
  $('fast').value=iv.fast;$('slow').value=iv.slow;paint()}
async function loadGames(){const r=await call('games/');if(r.status!==200)return;
  const l=r.data.results||r.data;$('game').innerHTML=l.map(g=>`<option value="${g.id}">${esc(g.name||g.title||'Spiel '+g.id)}</option>`).join('');
  if(sel)$('game').value=sel.gameId;await loadProfiles()}
async function loadProfiles(){const r=await call('profiles/',{gameId:$('game').value});if(r.status!==200)return;
  const l=r.data.results||r.data;$('profile').innerHTML=l.map(p=>`<option value="${p.id}">${esc(p.name||p.username||p.nickname||'Profil '+p.id)}</option>`).join('');
  if(sel)$('profile').value=sel.profileId}
$('game').onchange=loadProfiles;
$('login').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';
  const r=await raw('POST','token/',{username:$('u').value,password:$('p').value},null,false);$('p').value='';
  if(r.status!==200||!r.data?.access){$('msg').textContent=r.status===0?'Keine Verbindung':'Login fehlgeschlagen';return}
  tok={access:r.data.access,refresh:r.data.refresh};user=$('u').value;store.set('oy_tok',tok);store.set('oy_user',user);ui();loadGames()};
$('go').onclick=()=>{sel={gameId:$('game').value,profileId:$('profile').value};store.set('oy_sel',sel);startPolling();ui()};
$('stop').onclick=()=>{gen++;Object.values(timers).forEach(clearTimeout);sel=null;store.del('oy_sel');eps={};ui()};
$('out').onclick=()=>{Object.values(timers).forEach(clearTimeout);logout()};
[$('fast'),$('slow')].forEach(i=>i.onchange=()=>{iv={fast:Math.max(5,+$('fast').value||5),slow:Math.max(5,+$('slow').value||60)};store.set('oy_iv',iv);ui()});
setInterval(paint,2000);ui();
if(user){loadGames();if(sel)startPolling()}
</script>
</body>
</html>
