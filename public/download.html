<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dateien abholen</title>
  <meta name="theme-color" content="#0f0e0c">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%A5%3C/text%3E%3C/svg%3E">

  <!-- Damit auf dem Startbildschirm das eigene Symbol steht und nicht das
       Chrome-Logo: Android baut nur mit Manifest und Service Worker eine echte
       App daraus, sonst bleibt es eine Verknüpfung mit Browser-Abzeichen. -->
  <link rel="manifest" href="/download.webmanifest">
  <link rel="apple-touch-icon" href="/icons/abholen-apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Abholen">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Vor dem Freischalten ist hier nichts als das Codefeld. */
    .gate { animation: fadeUp 0.8s 0.15s ease both; }
    .gate .pw-form { display: flex; margin-top: 0; }
    .gate-hint { text-align: center; font-size: 0.75rem; color: var(--muted); opacity: 0.6; margin-top: 0.8rem; }
    #inhalt { display: none; }
    #inhalt.visible { display: block; }
    .files { display: block; }

    /* Abmelden und Benachrichtigungen gehören ins Kleingedruckte: gebraucht
       werden sie selten, erreichbar müssen sie sein – das Sitzungs-Cookie etwa
       kann die Seite selbst gar nicht löschen. */
    .fuss-knopf {
      background: none; border: 0; padding: 0;
      color: var(--muted); font: inherit; font-size: inherit;
      text-decoration: underline; text-underline-offset: 3px;
      cursor: pointer; opacity: 0.8;
    }
    .fuss-knopf:hover { color: var(--gold); }
    .fuss-knopf:disabled { cursor: default; text-decoration: none; }
    #footer .trenner { opacity: 0.4; margin: 0 0.5rem; }

    /* Die beiden Sammelknöpfe über den Listen. */
    .alles { margin-bottom: 1.8rem; animation: fadeUp 0.5s ease both; }
    .alles-knoepfe { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .alles-knoepfe .pw-submit { flex: 1; min-width: 11rem; }

    /* „Alles löschen“ trägt die Warnfarbe erst beim Anfassen: sichtbar
       gefährlich, aber nicht dauernd rot blinkend neben dem Normalfall. */
    .alles-weg { color: var(--muted); }
    .alles-weg:hover { border-color: var(--error); color: var(--error); background: #1f1917; }

    .alles-status {
      margin-top: 0.7rem; min-height: 1.1rem;
      font-size: 0.72rem; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .alles-status.fertig { color: var(--success); }
    .alles-status.fehler { color: var(--error); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <p class="eyebrow">Privater Bereich</p>
    <h1>Dateien <em>abholen</em></h1>
    <p class="subtitle" id="untertitel">Code aus der Authenticator-App eingeben.</p>
  </header>

  <div class="gate" id="gate">
    <div class="pw-form open">
      <input class="pw-input code-input" id="code-input" type="text" inputmode="numeric"
             autocomplete="one-time-code" maxlength="6" placeholder="000000"
             aria-label="Sechsstelliger Code aus der Authenticator-App" />
      <button class="pw-submit" id="code-submit" type="button">Öffnen</button>
    </div>
    <p class="gate-hint" id="gate-hint">Hochladen geht auf upload.veerka.mp.</p>
  </div>

  <div id="inhalt">
    <div class="alles" id="alles" hidden>
      <div class="alles-knoepfe">
        <button class="pw-submit" id="alles-laden" type="button">Alles herunterladen</button>
        <button class="pw-submit alles-weg" id="alles-loeschen" type="button" hidden>Alles löschen</button>
      </div>
      <p class="alles-status" id="alles-status"></p>
    </div>

    <section class="files">
      <h2>Texte &amp; Links</h2>
      <div id="notes-list"></div>
    </section>

    <section class="files">
      <h2>Dateien</h2>
      <div id="files-list"></div>
    </section>
  </div>

  <footer id="footer">
    <span id="footer-text"></span>
  </footer>
</div>

<!-- Zum Herzeigen: jemand hält sein Handy davor und landet im Briefkasten,
     ohne die Adresse abtippen zu müssen. Der Code steht fertig als /qr.svg im
     Repo (tools/make-qr.mjs) – die Adresse ändert sich nie, also muss dafür
     kein Encoder in die Seite. -->
<div class="qr-overlay" id="qr-overlay">
  <div class="qr-karte"><img src="/qr.svg" alt="QR-Code zu upload.veerka.mp" /></div>
  <p class="qr-adresse">upload.veerka.mp</p>
  <p class="qr-hinweis">zum Schließen tippen</p>
</div>

<div id="toast"></div>

<script>
  // Das Token liegt im localStorage und überlebt damit das Schließen des Tabs.
  // Das ist der Unterschied zur Upload-Seite: dort steht man vor einem fremden
  // Gerät, hier vor dem eigenen. Der Server gibt der Abhol-Sitzung dafür eine
  // Laufzeit von 30 Tagen und verlängert sie bei jedem Öffnen – wer die App
  // benutzt, wird nie wieder nach einem Code gefragt.
  //
  // Das Token ist damit ein Schlüssel, der auf dem Gerät liegen bleibt. Genau
  // dafür gibt es unten „abmelden“, und genau deshalb bleibt der 2FA-Code der
  // einzige Weg, überhaupt einen zu bekommen.
  const SPEICHER = 'download-session';

  let session = localStorage.getItem(SPEICHER) || null;
  let limits  = null;

  function merken(token) {
    session = token;
    try { localStorage.setItem(SPEICHER, token); } catch { /* privater Modus */ }
  }

  function vergessen() {
    session = null;
    try { localStorage.removeItem(SPEICHER); } catch { /* egal */ }
    // Das Cookie für die Download-Links ist HttpOnly, das muss der Server tun.
    fetch('/api/logout', { method: 'POST' }).catch(() => {});
  }

  const toast      = document.getElementById('toast');
  const codeInput  = document.getElementById('code-input');
  const codeSubmit = document.getElementById('code-submit');

  const authHeaders = () => (session ? { Authorization: 'Bearer ' + session } : {});

  function formatBytes(n) {
    if (n >= 1024 ** 3) return (n / 1024 ** 3).toFixed(n >= 10 * 1024 ** 3 ? 0 : 1) + ' GB';
    if (n >= 1024 ** 2) return Math.round(n / 1024 ** 2) + ' MB';
    if (n >= 1024)      return Math.round(n / 1024) + ' KB';
    return n + ' B';
  }

  function showToast(msg, type = '') {
    toast.textContent = msg;
    toast.className = `show ${type}`;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { toast.className = ''; }, 4000);
  }

  function emptyHint(list, text) {
    const p = document.createElement('p');
    p.className = 'files-empty';
    p.textContent = text;
    list.appendChild(p);
  }

  // ── Freischalten ───────────────────────────────────────────────────────────

  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    if (codeInput.value.length === 6) unlock();
  });
  codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
  codeSubmit.addEventListener('click', unlock);

  let unlocking = false;

  async function unlock() {
    const code = codeInput.value.trim();
    if (unlocking || code.length !== 6) return;

    unlocking = true;
    codeSubmit.disabled = true;
    codeSubmit.textContent = '…';

    try {
      const res  = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // Hier – und nur hier – wird um die lange Sitzung gebeten.
        body: JSON.stringify({ code, remember: true }),
      });
      const data = await res.json();

      if (res.ok && data.token) {
        merken(data.token);
        codeInput.value = '';
        oeffnen();
      } else {
        codeInput.value = '';
        codeInput.classList.add('shake');
        setTimeout(() => codeInput.classList.remove('shake'), 400);
        showToast(data.error || 'Code stimmt nicht', 'error');
      }
    } catch {
      showToast('Verbindungsfehler – bitte erneut versuchen', 'error');
    } finally {
      unlocking = false;
      codeSubmit.disabled = false;
      codeSubmit.textContent = 'Öffnen';
    }
  }

  function oeffnen() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('inhalt').classList.add('visible');
    document.getElementById('untertitel').textContent = 'Alles, was bei mir angekommen ist.';
    zeigeQr();
    zeigeAbmelden();
    zeigePush();
    loadFiles();
    loadNotes();
  }

  // Hängt einen Textknopf ans Kleingedruckte im Fuß.
  function fussKnopf(id, beschriftung, beiKlick) {
    const box = document.createElement('span');
    box.id = id + '-box';

    const trenner = document.createElement('span');
    trenner.className = 'trenner';
    trenner.textContent = '·';

    const knopf = document.createElement('button');
    knopf.id = id;
    knopf.className = 'fuss-knopf';
    knopf.type = 'button';
    knopf.textContent = beschriftung;
    knopf.onclick = beiKlick;

    box.append(trenner, knopf);
    document.getElementById('footer').appendChild(box);
    return knopf;
  }

  // Der QR-Code zeigt auf die Upload-Adresse, nicht auf diese hier: er ist zum
  // Herzeigen da, damit jemand anders etwas einwerfen kann. Wer schon hier
  // steht, braucht ihn nicht.
  function zeigeQr() {
    if (document.getElementById('qr-box')) return;
    const overlay = document.getElementById('qr-overlay');
    const zu = () => overlay.classList.remove('offen');
    // Irgendwohin tippen schließt – die Fläche ist die Schaltfläche, damit man
    // beim Wegräumen nicht erst ein kleines Kreuz treffen muss.
    overlay.onclick = zu;
    addEventListener('keydown', e => { if (e.key === 'Escape') zu(); });
    fussKnopf('qr', 'QR zum Einwerfen', () => overlay.classList.add('offen'));
  }

  function zeigeAbmelden() {
    if (document.getElementById('abmelden-box')) return;
    fussKnopf('abmelden', 'abmelden', () => {
      vergessen();
      location.reload();
    });
  }

  // ── Benachrichtigungen ─────────────────────────────────────────────────────
  //
  // Push braucht einen Service Worker – den gibt es hier ohnehin, weil die
  // Seite sonst gar nicht installierbar wäre. Auf iPhones existiert
  // window.Notification allerdings nur, wenn die Seite vom Startbildschirm
  // gestartet wurde; im normalen Safari-Tab ist Push schlicht nicht vorhanden.

  const pushMoeglich = 'serviceWorker' in navigator
    && 'PushManager' in window
    && 'Notification' in window;

  const aufStartbildschirm = () =>
    window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  // Der öffentliche VAPID-Schlüssel kommt als base64url und muss als Bytes an
  // subscribe() gehen.
  function schluesselBytes(b64) {
    const s = b64.replace(/-/g, '+').replace(/_/g, '/');
    const roh = atob(s + '='.repeat((4 - (s.length % 4)) % 4));
    return Uint8Array.from(roh, c => c.charCodeAt(0));
  }

  const laufendesAbo = async () =>
    (await navigator.serviceWorker.ready).pushManager.getSubscription();

  async function pushEinschalten() {
    // Muss aus einem Tipp heraus geschehen, sonst lehnt Safari sofort ab.
    if (await Notification.requestPermission() !== 'granted') {
      showToast('Benachrichtigungen wurden abgelehnt', 'error');
      return false;
    }

    const reg = await navigator.serviceWorker.ready;
    const abo = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: schluesselBytes(limits.pushPublicKey),
    });

    const { endpoint, keys } = abo.toJSON();
    const res = await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ endpoint, p256dh: keys.p256dh, auth: keys.auth }),
    });
    if (!res.ok) {
      // Nicht angenommen: dann auch im Browser nicht stehen lassen, sonst
      // meldet er sich für etwas an, wovon der Server nichts weiß.
      await abo.unsubscribe().catch(() => {});
      throw new Error();
    }
    return true;
  }

  async function pushAusschalten() {
    const abo = await laufendesAbo();
    if (!abo) return;
    await fetch('/api/push/unsubscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ endpoint: abo.endpoint }),
    }).catch(() => {});
    await abo.unsubscribe();
  }

  async function zeigePush() {
    if (document.getElementById('push-box')) return;
    if (!limits?.pushPublicKey) return;

    if (!pushMoeglich) {
      // Auf dem iPhone ist das kein Fehler, sondern eine Bedingung – und eine,
      // die sich mit zwei Tipps erfüllen lässt.
      if (!aufStartbildschirm()) {
        const hinweis = document.createElement('span');
        hinweis.id = 'push-box';
        hinweis.innerHTML = '<span class="trenner">·</span>';
        hinweis.append('für Benachrichtigungen zum Startbildschirm hinzufügen');
        document.getElementById('footer').appendChild(hinweis);
      }
      return;
    }

    let an = Boolean(await laufendesAbo());
    const knopf = fussKnopf('push', '', null);

    const beschriften = () => {
      knopf.textContent = an ? 'Benachrichtigungen aus' : 'Benachrichtigungen an';
    };
    beschriften();

    knopf.onclick = async () => {
      knopf.disabled = true;
      const vorher = knopf.textContent;
      knopf.textContent = '…';
      try {
        if (an) {
          await pushAusschalten();
          an = false;
          showToast('Benachrichtigungen aus');
        } else {
          if (!(await pushEinschalten())) return;
          an = true;
          showToast('Benachrichtigungen an', 'success');
        }
      } catch {
        knopf.textContent = vorher;
        showToast('Hat nicht geklappt', 'error');
      } finally {
        knopf.disabled = false;
        beschriften();
      }
    };
  }

  // ── Alles auf einmal ───────────────────────────────────────────────────────
  //
  // Der Reihe nach, nicht parallel: jede Datei wird einzeln geholt und erst
  // dann gespeichert. Das kostet Zeit, ist dafür aber ehrlich – am Ende steht
  // fest, welche Dateien wirklich angekommen sind. Nur die dürfen anschließend
  // gelöscht werden.
  //
  // Bewusst nicht als ZIP vom Server: das Archivformat verlangt eine Prüfsumme
  // über den gesamten Inhalt, und die müsste der Worker über jedes Byte
  // rechnen. Bei zehn Gigabyte reißt das die Rechenzeit-Grenze.

  const allesBox      = document.getElementById('alles');
  const allesLaden    = document.getElementById('alles-laden');
  const allesLoeschen = document.getElementById('alles-loeschen');
  const allesStatus   = document.getElementById('alles-status');

  // Was zuletzt in den Listen stand …
  const bestand = { files: [], notes: [] };
  // Läuft gerade ein Sammel-Download? Dann darf ein Neuladen der Listen den
  // Knopf nicht wieder freigeben.
  let laeuft = false;
  // … und was davon vollständig heruntergeladen wurde. Bleibt null, solange
  // auch nur eine Datei gefehlt hat – dann gibt es nichts zu löschen.
  let geholt = null;

  function melde(text, art = '') {
    allesStatus.textContent = text;
    allesStatus.className = 'alles-status ' + art;
  }

  function zeigeAlles() {
    const n = bestand.files.length + bestand.notes.length;
    allesBox.hidden = n === 0;
    allesLaden.disabled = laeuft || n === 0;
  }

  // Legt einen Blob als Datei ab. Der Objektschlüssel wird verzögert
  // freigegeben: sofort danach bricht der Browser den Download unter Umständen
  // wieder ab, weil die Quelle unter ihm wegfällt.
  function speichern(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10_000);
  }

  allesLaden.onclick = async () => {
    const dateien = bestand.files.slice();
    const texte   = bestand.notes.slice();
    if (!dateien.length && !texte.length) return;

    geholt = null;
    laeuft = true;
    allesLoeschen.hidden = true;
    allesLaden.disabled = true;
    allesLaden.textContent = 'lädt …';

    const fertig = { keys: [], noteIds: [] };
    let aktuell = 'Texte & Links';

    try {
      // Die Texte zuerst und alle zusammen in eine Datei – einzeln wären es
      // lauter Schnipsel, und lesen will man sie ohnehin am Stück.
      if (texte.length) {
        const inhalt = texte.map(n =>
          `── ${new Date(n.createdAt).toLocaleString('de-DE')} ──\n${n.text}`,
        ).join('\n\n');
        speichern(new Blob([inhalt], { type: 'text/plain;charset=utf-8' }), 'Texte-und-Links.txt');
        fertig.noteIds = texte.map(n => n.id);
      }

      for (let i = 0; i < dateien.length; i++) {
        const f = dateien[i];
        aktuell = f.name;
        melde(`${i + 1} von ${dateien.length} · ${f.name}`);

        const res = await fetch('/api/files/download?key=' + encodeURIComponent(f.key), {
          headers: authHeaders(),
        });
        if (res.status === 401) return abgelaufen();
        if (!res.ok) throw new Error('HTTP ' + res.status);

        speichern(await res.blob(), f.name);
        fertig.keys.push(f.key);

        // Kurze Pause: sonst wirft der Browser bei vielen Dateien hintereinander
        // welche weg, statt sie alle zu speichern.
        if (i < dateien.length - 1) await new Promise(r => setTimeout(r, 400));
      }

      geholt = fertig;
      allesLoeschen.hidden = false;
      melde(`${fertig.keys.length} Datei(en) und ${fertig.noteIds.length} Text(e) heruntergeladen.`, 'fertig');
    } catch {
      // Ein Fehlschlag reicht: dann wird nichts zum Löschen angeboten.
      melde(`„${aktuell}“ konnte nicht geladen werden – nichts wird gelöscht.`, 'fehler');
      showToast('Herunterladen abgebrochen', 'error');
    } finally {
      laeuft = false;
      allesLaden.disabled = false;
      allesLaden.textContent = 'Alles herunterladen';
    }
  };

  allesLoeschen.onclick = async () => {
    if (!geholt) return;
    const { keys, noteIds } = geholt;

    if (!confirm(
      `${keys.length} Datei(en) und ${noteIds.length} Text(e) endgültig löschen?\n\n`
      + 'Gelöscht wird genau das eben Heruntergeladene. Später Angekommenes '
      + 'bleibt liegen.\n\nDas lässt sich nicht rückgängig machen.'
    )) return;

    allesLoeschen.disabled = true;
    try {
      const res = await fetch('/api/purge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ keys, noteIds }),
      });
      if (res.status === 401) return abgelaufen();
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '');

      geholt = null;
      allesLoeschen.hidden = true;
      melde(`${data.files} Datei(en) und ${data.notes} Text(e) gelöscht.`, 'fertig');
      showToast(`${data.files} Datei(en) und ${data.notes} Text(e) gelöscht`, 'success');
      loadFiles();
      loadNotes();
    } catch {
      showToast('Löschen fehlgeschlagen', 'error');
    } finally {
      allesLoeschen.disabled = false;
    }
  };

  // ── Dateien ────────────────────────────────────────────────────────────────

  async function loadFiles() {
    const list = document.getElementById('files-list');
    try {
      const res = await fetch('/api/files', { headers: authHeaders() });
      if (res.status === 401) return abgelaufen();
      if (!res.ok) return;
      const { files } = await res.json();
      bestand.files = files;
      zeigeAlles();

      list.textContent = '';
      if (!files.length) emptyHint(list, 'Noch nichts da.');

      for (const f of files) {
        const row = document.createElement('div');
        row.className = 'file-row';

        const a = document.createElement('a');
        // Kein innerHTML: der Dateiname stammt vom Absender.
        a.textContent = f.name;
        a.title = f.name;
        a.href = '/api/files/download?key=' + encodeURIComponent(f.key);
        a.setAttribute('download', f.name);

        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = `${formatBytes(f.size)} · ${new Date(f.uploadedAt).toLocaleDateString('de-DE')}`;

        const del = document.createElement('button');
        del.className = 'danger';
        del.type = 'button';
        del.textContent = 'löschen';
        del.onclick = async () => {
          if (!confirm(`„${f.name}“ endgültig löschen?`)) return;
          try {
            const r = await fetch('/api/files?key=' + encodeURIComponent(f.key), {
              method: 'DELETE', headers: authHeaders(),
            });
            if (!r.ok) throw new Error();
            loadFiles();
          } catch { showToast('Löschen fehlgeschlagen', 'error'); }
        };

        row.append(a, meta, del);
        list.appendChild(row);
      }
    } catch {
      showToast('Liste konnte nicht geladen werden', 'error');
    }
  }

  // ── Texte ──────────────────────────────────────────────────────────────────

  // Baut aus reinem Text Knoten und macht dabei http(s)-Adressen anklickbar.
  // Bewusst über DOM-Knoten und nicht über innerHTML: der Text kommt von
  // fremden Leuten. Andere Schemata – allen voran javascript: – bleiben Text.
  function linkify(text) {
    const frag = document.createDocumentFragment();
    const re = /https?:\/\/[^\s<>"']+/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.append(text.slice(last, m.index));
      const a = document.createElement('a');
      a.href = m[0];
      a.textContent = m[0];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.append(text.slice(last));
    return frag;
  }

  async function loadNotes() {
    const list = document.getElementById('notes-list');
    try {
      const res = await fetch('/api/notes', { headers: authHeaders() });
      if (!res.ok) return;
      const { notes } = await res.json();
      bestand.notes = notes;
      zeigeAlles();

      list.textContent = '';
      if (!notes.length) emptyHint(list, 'Noch nichts da.');

      for (const n of notes) {
        const row = document.createElement('div');
        row.className = 'note-row';

        const body = document.createElement('div');
        body.className = 'note-text';
        body.appendChild(linkify(n.text));

        const tools = document.createElement('div');
        tools.className = 'note-tools';

        const when = document.createElement('span');
        when.textContent = new Date(n.createdAt).toLocaleString('de-DE',
          { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

        const copy = document.createElement('button');
        copy.type = 'button';
        copy.textContent = 'kopieren';
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(n.text);
            copy.textContent = 'kopiert ✓';
            setTimeout(() => { copy.textContent = 'kopieren'; }, 1500);
          } catch {
            showToast('Zwischenablage nicht verfügbar', 'error');
          }
        };

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'danger';
        del.textContent = 'löschen';
        del.onclick = async () => {
          try {
            await fetch('/api/notes?id=' + encodeURIComponent(n.id), {
              method: 'DELETE', headers: authHeaders(),
            });
            loadNotes();
          } catch { showToast('Löschen fehlgeschlagen', 'error'); }
        };

        tools.append(when, copy, del);
        row.append(body, tools);
        list.appendChild(row);
      }
    } catch {
      // Texte sind Beiwerk – ein Fehler hier soll die Dateiliste nicht stören.
    }
  }

  function abgelaufen() {
    vergessen();
    geholt = null;
    bestand.files = [];
    bestand.notes = [];
    zeigeAlles();
    allesLoeschen.hidden = true;
    melde('');
    document.getElementById('gate').style.display = '';
    document.getElementById('inhalt').classList.remove('visible');
    document.getElementById('qr-box')?.remove();
    document.getElementById('abmelden-box')?.remove();
    document.getElementById('push-box')?.remove();
    document.getElementById('qr-overlay').classList.remove('offen');
    showToast('Sitzung abgelaufen – bitte neuen Code eingeben', 'error');
  }

  // ── Start ──────────────────────────────────────────────────────────────────

  // Der Service Worker speichert nur das Gerüst der Seite, nie Daten aus
  // /api/ – siehe Kommentar in sw.js. Er hängt hier bewusst nicht am
  // load-Ereignis: die Seite ist klein, und ohne ihn gibt es kein Symbol.
  navigator.serviceWorker?.register('/sw.js').catch(() => {});

  (async () => {
    try {
      const res = await fetch('/api/status', { headers: authHeaders() });
      limits = await res.json();
    } catch {
      showToast('Server nicht erreichbar', 'error');
      return;
    }

    // Der Server schickt ein frisches Token, sobald die Hälfte der Laufzeit
    // herum ist. So verschiebt sich der Ablauf mit jedem Öffnen nach hinten.
    if (limits.token) merken(limits.token);

    // Abgelaufen oder nicht mehr gültig: dann liegt es nur noch im Weg.
    if (session && !limits.elevated) vergessen();

    document.getElementById('footer-text').textContent =
      `Dateien werden nach ${limits.retentionDays} Tagen automatisch gelöscht.`;

    if (!limits.twoFactorConfigured) {
      document.getElementById('gate-hint').textContent =
        'Auf dem Server ist keine Zwei-Faktor-Anmeldung eingerichtet.';
      codeInput.disabled = true;
      codeSubmit.disabled = true;
      return;
    }

    // Ein noch gültiges Token vom letzten Mal spart den Code.
    if (limits.elevated) oeffnen(); else codeInput.focus();
  })();
</script>
</body>
</html>
