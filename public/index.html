<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dateien senden</title>
  <meta name="theme-color" content="#0f0e0c">
  <!-- Persönlicher Upload-Briefkasten – hat in Suchmaschinen nichts verloren. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Favicon inline, spart eine 404-Anfrage bei jedem Seitenaufruf. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%A4%3C/text%3E%3C/svg%3E">
  <!-- Die Schrift-CSS liegt bei googleapis, die Font-Dateien selbst bei
       gstatic – ohne das zweite preconnect wartet der Browser zweimal. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
  <header>
    <p class="eyebrow">Dateiübertragung</p>
    <h1>Dateien <em>senden</em></h1>
    <p class="subtitle">Hier kannst du mir Dateien, Fotos, Videos oder Dokumente<br>direkt zukommen lassen.</p>
  </header>

  <div class="dropzone" id="dropzone">
    <input type="file" id="file-input" multiple aria-label="Dateien auswählen" />
    <svg class="drop-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4L24 32M24 4L16 12M24 4L32 12" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 36V40C8 41.1 8.9 42 10 42H38C39.1 42 40 41.1 40 40V36" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <p class="drop-label"><strong>Dateien auswählen</strong> oder hierher ziehen</p>
    <p class="drop-hint" id="drop-hint">Alle Dateitypen</p>
  </div>

  <div id="preview-grid"></div>

  <div class="note-area">
    <textarea class="note-input" id="note-input"
              placeholder="… oder Text und Links hier einfügen"
              aria-label="Text oder Links einfügen"></textarea>
    <p class="note-count" id="note-count"></p>
  </div>

  <div id="progress-area"></div>

  <button class="upload-btn" id="upload-btn" disabled>Senden</button>

  <div class="pw-area">
    <button class="pw-toggle" id="pw-toggle" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Größeres Limit freischalten (bis 10 GB)
    </button>
    <div class="pw-form" id="pw-form">
      <input class="pw-input code-input" id="code-input" type="text" inputmode="numeric"
             autocomplete="one-time-code" maxlength="6" placeholder="000000"
             aria-label="Sechsstelliger Code aus der Authenticator-App" />
      <button class="pw-submit" id="code-submit" type="button">Freischalten</button>
    </div>
    <div class="pw-badge" id="pw-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      10 GB Limit aktiv
    </div>
    <p class="limit-info" id="limit-info">Limit wird geladen…</p>
  </div>

  <footer id="footer">Übertragung per HTTPS. Die Dateien liegen in privatem Cloudflare-Speicher.</footer>
</div>

<div id="toast"></div>

<script>
  // ── Zustand ────────────────────────────────────────────────────────────────

  // Der Sitzungstoken hält nur, solange der Tab offen ist. Wer neu lädt,
  // tippt einen neuen Code – das ist bei 2FA zumutbar und deutlich besser,
  // als das Token dauerhaft im Browser liegen zu lassen.
  let session   = sessionStorage.getItem('upload-session') || null;
  let limits    = null;
  let selected  = [];

  // Wie viele Teilstücke gleichzeitig laufen. Mehr macht die Leitung selten
  // schneller, kostet aber im Worker Arbeitsspeicher.
  const PARALLEL_PARTS = 3;

  const dropzone     = document.getElementById('dropzone');
  const fileInput    = document.getElementById('file-input');
  const previewGrid  = document.getElementById('preview-grid');
  const progressArea = document.getElementById('progress-area');
  const uploadBtn    = document.getElementById('upload-btn');
  const toast        = document.getElementById('toast');
  const limitInfo    = document.getElementById('limit-info');
  const dropHint     = document.getElementById('drop-hint');
  const noteInput    = document.getElementById('note-input');
  const noteCount    = document.getElementById('note-count');

  // Der Senden-Knopf gilt für beides: ausgewählte Dateien und eingefügten Text.
  const refreshSendButton = () => {
    uploadBtn.disabled = selected.length === 0 && !noteInput.value.trim();
  };

  const authHeaders = () => (session ? { Authorization: 'Bearer ' + session } : {});

  function formatBytes(n) {
    if (n >= 1024 ** 3) return (n / 1024 ** 3).toFixed(n >= 10 * 1024 ** 3 ? 0 : 1) + ' GB';
    if (n >= 1024 ** 2) return Math.round(n / 1024 ** 2) + ' MB';
    if (n >= 1024)      return Math.round(n / 1024) + ' KB';
    return n + ' B';
  }

  function showToast(msg, type = '') {
    toast.textContent = msg;
    toast.className = `show ${type}`;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { toast.className = ''; }, 4000);
  }

  // ── Limits vom Server holen ────────────────────────────────────────────────
  //
  // Die Anzeige hier ist reine Höflichkeit. Verbindlich sind allein die
  // Prüfungen im Worker – der Browser kann alles behaupten.

  async function loadStatus() {
    try {
      const res = await fetch('/api/status', { headers: authHeaders() });
      limits = await res.json();
    } catch {
      limitInfo.textContent = 'Server nicht erreichbar.';
      return;
    }

    // Ein abgelaufenes Token meldet der Server als „nicht freigeschaltet“.
    if (session && !limits.elevated) {
      session = null;
      sessionStorage.removeItem('upload-session');
    }

    dropHint.textContent = `Alle Dateitypen · Max. ${formatBytes(limits.maxFileBytes)} pro Datei`;
    document.getElementById('footer').textContent =
      `Übertragung per HTTPS. Dateien werden nach ${limits.retentionDays} Tagen automatisch gelöscht.`;

    if (limits.elevated) {
      document.getElementById('pw-toggle').style.display = 'none';
      document.getElementById('pw-form').classList.remove('open');
      document.getElementById('pw-badge').classList.add('visible');
      limitInfo.innerHTML = `Aktuelles Limit: <span class="unlocked">${formatBytes(limits.maxFileBytes)}</span> pro Datei`;
    } else {
      limitInfo.innerHTML =
        `Aktuelles Limit: <span>${formatBytes(limits.maxFileBytes)}</span> pro Datei · ` +
        `noch ${limits.filesRemainingToday} von ${limits.filesPerDay} Dateien heute`;
      if (!limits.twoFactorConfigured) document.getElementById('pw-toggle').style.display = 'none';
    }
  }

  // ── Freischalten ───────────────────────────────────────────────────────────

  const codeInput  = document.getElementById('code-input');
  const codeSubmit = document.getElementById('code-submit');

  document.getElementById('pw-toggle').addEventListener('click', () => {
    const form = document.getElementById('pw-form');
    form.classList.toggle('open');
    if (form.classList.contains('open')) codeInput.focus();
  });

  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    if (codeInput.value.length === 6) unlock();
  });
  codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
  codeSubmit.addEventListener('click', unlock);

  let unlocking = false;

  async function unlock() {
    const code = codeInput.value.trim();
    if (unlocking || code.length !== 6) return;

    unlocking = true;
    codeSubmit.disabled = true;
    codeSubmit.textContent = '…';

    try {
      const res  = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();

      if (res.ok && data.token) {
        session = data.token;
        sessionStorage.setItem('upload-session', session);
        codeInput.value = '';
        showToast('Freigeschaltet – bis 10 GB pro Datei', 'success');
        await loadStatus();
      } else {
        codeInput.value = '';
        codeInput.classList.add('shake');
        setTimeout(() => codeInput.classList.remove('shake'), 400);
        showToast(data.error || 'Code stimmt nicht', 'error');
      }
    } catch {
      showToast('Verbindungsfehler – bitte erneut versuchen', 'error');
    } finally {
      unlocking = false;
      codeSubmit.disabled = false;
      codeSubmit.textContent = 'Freischalten';
    }
  }

  // ── Dateien auswählen ──────────────────────────────────────────────────────

  let dragDepth = 0;
  dropzone.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragover',  e => e.preventDefault());
  dropzone.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; dropzone.classList.remove('dragover'); } });
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    dropzone.classList.remove('dragover');
    addFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => addFiles([...fileInput.files]));

  // Ohne das öffnet der Browser eine daneben fallen gelassene Datei einfach
  // im Tab – und die ausgewählten Dateien sind weg.
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop',     e => e.preventDefault());

  function addFiles(incoming) {
    const max = limits?.maxFileBytes ?? Infinity;
    const tooBig = [];

    for (const f of incoming) {
      if (f.size > max) { tooBig.push(f.name); continue; }
      if (!selected.some(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) {
        selected.push(f);
      }
    }

    if (tooBig.length) {
      showToast(
        `Zu groß (max. ${formatBytes(max)}): ${tooBig.slice(0, 2).join(', ')}` +
        (tooBig.length > 2 ? ` +${tooBig.length - 2}` : ''),
        'error',
      );
    }

    renderPreviews();
    refreshSendButton();
  }

  noteInput.addEventListener('input', () => {
    const max = limits?.maxNoteChars ?? 20000;
    if (noteInput.value.length > max) noteInput.value = noteInput.value.slice(0, max);
    const n = noteInput.value.length;
    noteCount.textContent = n ? `${n.toLocaleString('de-DE')} / ${max.toLocaleString('de-DE')} Zeichen` : '';
    refreshSendButton();
  });

  function fileIcon(f) {
    if (f.type.startsWith('image/')) return null;
    if (f.type.startsWith('video/')) return '🎬';
    if (f.type.startsWith('audio/')) return '🎵';
    if (f.type.includes('pdf'))      return '📄';
    if (/zip|rar|7z|tar/.test(f.type)) return '🗜️';
    if (f.type.includes('word')  || f.name.endsWith('.docx')) return '📝';
    if (f.type.includes('sheet') || f.name.endsWith('.xlsx')) return '📊';
    return '📁';
  }

  // Jede Bildvorschau belegt über URL.createObjectURL Speicher, den der Browser
  // erst beim revokeObjectURL wieder freigibt.
  let previewUrls = [];

  function renderPreviews() {
    previewUrls.forEach(URL.revokeObjectURL);
    previewUrls = [];
    previewGrid.textContent = '';

    selected.forEach(file => {
      const wrap = document.createElement('div');
      wrap.className = 'preview-wrap';
      const thumb = document.createElement('div');
      thumb.className = 'preview-thumb';

      const icon = fileIcon(file);
      if (!icon) {
        const img = document.createElement('img');
        const url = URL.createObjectURL(file);
        previewUrls.push(url);
        img.src = url;
        img.alt = '';
        img.decoding = 'async';
        thumb.appendChild(img);
      } else {
        thumb.textContent = icon;
      }

      const btn = document.createElement('button');
      btn.className = 'remove-btn';
      btn.type = 'button';
      btn.textContent = '×';
      btn.title = 'Entfernen';
      // Über die Datei selbst entfernen statt über den Index: der Index einer
      // Vorschau stimmt sonst nicht mehr, sobald davor etwas gelöscht wurde.
      btn.onclick = () => {
        selected = selected.filter(f => f !== file);
        renderPreviews();
        refreshSendButton();
      };
      thumb.appendChild(btn);

      const label = document.createElement('div');
      label.className = 'file-name-tag';
      label.textContent = file.name;
      label.title = file.name;

      wrap.append(thumb, label);
      previewGrid.appendChild(wrap);
    });
  }

  // ── Senden ─────────────────────────────────────────────────────────────────

  uploadBtn.addEventListener('click', async () => {
    const note = noteInput.value.trim();
    if (!selected.length && !note) return;

    uploadBtn.disabled = true;
    progressArea.style.display = 'block';
    progressArea.textContent = '';

    // Erst der Text – der ist in einem Rutsch durch und wäre sonst nach einem
    // langen Datei-Upload immer noch nicht abgeschickt.
    let noteFailed = false;
    if (note) {
      try {
        await api('/api/note', { text: note });
        noteInput.value = '';
        noteCount.textContent = '';
      } catch (err) {
        noteFailed = true;
        showToast(err.message, 'error');
      }
    }

    // Fehlgeschlagene Dateien bleiben ausgewählt, damit ein zweiter Klick
    // reicht, statt alles neu heraussuchen zu müssen.
    const failed = [];
    for (const file of selected) {
      if (!(await uploadFile(file))) failed.push(file);
    }

    selected = failed;
    fileInput.value = '';
    renderPreviews();
    refreshSendButton();

    if (failed.length) {
      showToast(`${failed.length} Datei(en) nicht angekommen – nochmal senden?`, 'error');
    } else if (!noteFailed) {
      showToast('Alles angekommen!', 'success');
    }

    loadStatus();
  });

  // Baut die Fortschrittszeile per DOM auf. Kein innerHTML: ein Dateiname darf
  // spitze Klammern enthalten und würde sonst als HTML in die Seite geraten.
  function progressRow(file) {
    const row = document.createElement('div');
    row.className = 'progress-file';
    const col = document.createElement('div');
    col.style.flex = '1';
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;justify-content:space-between;align-items:center';

    const name = document.createElement('span');
    name.className = 'progress-file-name';
    name.textContent = file.name;
    name.title = file.name;

    const status = document.createElement('span');
    status.className = 'progress-status status-uploading';
    status.textContent = '0 %';

    head.append(name, status);
    const wrap = document.createElement('div');
    wrap.className = 'progress-bar-wrap';
    const bar = document.createElement('div');
    bar.className = 'progress-bar-fill';
    wrap.appendChild(bar);
    col.append(head, wrap);
    row.appendChild(col);
    progressArea.appendChild(row);
    return { status, bar };
  }

  async function uploadFile(file) {
    const { status, bar } = progressRow(file);
    let ticket = null;

    try {
      // 1. Anmelden. Hier entscheidet der Server über Limit und Kontingent.
      const init = await api('/api/upload/init', {
        fileName: file.name,
        size: file.size,
        contentType: file.type || 'application/octet-stream',
      });
      ticket = init.upload;

      // 2. In Teilstücke zerlegen und hochladen. Weil alles über die eigene
      //    Domain läuft, liefert XMLHttpRequest hier echten Sende-Fortschritt –
      //    bei einer fremden Domain würde der Listener einen CORS-Preflight
      //    auslösen.
      const partCount = init.partCount;
      const partSize  = init.partSize;
      const done      = new Array(partCount).fill(0);
      const etags     = new Array(partCount);

      const redraw = () => {
        const sent = done.reduce((a, b) => a + b, 0);
        const pct  = file.size ? Math.min(100, (sent / file.size) * 100) : 100;
        bar.style.width = pct + '%';
        status.textContent = Math.floor(pct) + ' %';
      };

      let next = 0;
      const worker = async () => {
        while (true) {
          const i = next++;
          if (i >= partCount) return;
          const blob = file.slice(i * partSize, Math.min((i + 1) * partSize, file.size));
          const res = await putPart(ticket, i + 1, blob, sent => { done[i] = sent; redraw(); });
          etags[i] = { partNumber: res.partNumber, etag: res.etag };
          done[i] = blob.size;
          redraw();
        }
      };

      await Promise.all(
        Array.from({ length: Math.min(PARALLEL_PARTS, partCount) }, worker),
      );

      // 3. Zusammensetzen lassen.
      status.textContent = 'Wird abgelegt…';
      await api('/api/upload/complete', { upload: ticket, parts: etags });

      status.textContent = '✓ Angekommen';
      status.className = 'progress-status status-done';
      bar.style.width = '100%';
      bar.style.background = 'var(--success)';
      return true;
    } catch (err) {
      status.textContent = '✗ Fehler';
      status.className = 'progress-status status-error';
      status.title = err?.message || String(err);
      console.error(file.name, err);

      // Angefangenen Upload aufräumen, damit er kein Kontingent blockiert.
      if (ticket) api('/api/upload/abort', { upload: ticket }).catch(() => {});
      return false;
    }
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify(body),
    });
    let data = null;
    try { data = await res.json(); } catch { /* gleich als Fehler behandelt */ }
    if (!res.ok) throw new Error(data?.error || `Server antwortete mit ${res.status}`);
    return data;
  }

  function putPart(ticket, partNumber, blob, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', `/api/upload/part?upload=${encodeURIComponent(ticket)}&part=${partNumber}`);
      if (session) xhr.setRequestHeader('Authorization', 'Bearer ' + session);
      xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
      xhr.onload = () => {
        let data = null;
        try { data = JSON.parse(xhr.responseText); } catch { /* s. u. */ }
        if (xhr.status >= 200 && xhr.status < 300 && data) resolve(data);
        else reject(new Error(data?.error || `Teil ${partNumber} abgelehnt (${xhr.status})`));
      };
      xhr.onerror = () => reject(new Error('Verbindung unterbrochen'));
      xhr.send(blob);
    });
  }

  loadStatus();
</script>
</body>
</html>
